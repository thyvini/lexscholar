name: T005 native candidate (isolated)
on:
  pull_request:
    branches: [feat/f012-darwin-deletion]
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15-arm64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Record native environment and SDK flags
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          sw_vers
          uname -a
          dotnet --info
          stat -f 'temporary filesystem: %T' "$RUNNER_TEMP"
          printf '#include <fcntl.h>\n#include <stdio.h>\nint main(void){printf("O_DIRECTORY=%%x O_CLOEXEC=%%x O_NOFOLLOW=%%x\\n", O_DIRECTORY, O_CLOEXEC, O_NOFOLLOW);}\n' > "$RUNNER_TEMP/flags.c"
          clang -Wall -Wextra -Werror "$RUNNER_TEMP/flags.c" -o "$RUNNER_TEMP/flags"
          "$RUNNER_TEMP/flags"
          git rev-parse HEAD
      - name: Native storage and managed reimport tests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for project in tests/LexScholar.Infrastructure.Tests/LexScholar.Infrastructure.Tests.fsproj tests/LexScholar.Server.Tests/LexScholar.Server.Tests.fsproj; do
            dotnet test --project "$project" -c Release --filter-trait 'Task=T005' --filter-trait 'Task=T013' --filter-trait 'Task=T015' 2>&1 | tee "$RUNNER_TEMP/$(basename "$project").log"
            awk '/^[[:space:]]+total: [0-9]+/ { t += $2 } /^[[:space:]]+skipped: [0-9]+/ { s += $2 } END { if (!t || s) exit 1 }' "$RUNNER_TEMP/$(basename "$project").log"
          done
