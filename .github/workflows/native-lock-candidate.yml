name: Native lock candidate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-lock:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Native T002 ownership
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
          uname -m
          df -T "$RUNNER_TEMP" || df "$RUNNER_TEMP"
          dotnet --info
          dotnet test --project tests/LexScholar.Server.Tests/LexScholar.Server.Tests.fsproj -c Release --filter-trait Category=NativeOwnership
